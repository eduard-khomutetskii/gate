        - paragraph [ref=f3e117]: "«Технологичность для нас — это способ транслировать 30-летний опыт в конкретные преимущества для клиента: сервис 24/7, экспертную поддержку, безопасность сотрудников в поездках и бесперебойность всех операций. Создавая GATE, мы отвечали на запрос рынка, открывая инфраструктуру „Аэроклуба“ любому бизнесу."
        - paragraph [ref=f3e118]: Для клиента это значит работать на лучших условиях от лидера рынка, получив проверенное ИТ-решение и готовую сервисную модель, где использование алгоритмов автоматизирует процессы, экономя тревел-бюджет и время сотрудников. С GATE вы подключаетесь к экспертизе, ставшей отраслевым стандартом, и сразу фокусируетесь на задачах своего бизнеса».
